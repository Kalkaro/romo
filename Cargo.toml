[package]
name = "romo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A quiet, local-first whiteboard for your next big idea"
license = "MIT"

[dependencies]
gpui = "=0.2.2"
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
directories = "6"
rfd = "0.17.2"
unicode-segmentation = "1"
lyon = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }

# Graphics tablets on Wayland, read on GPUI's own connection. These match GPUI's versions.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client", "unstable"] }

[profile.release]
strip = true

# GPUI's full debug symbols are expensive to compile and link.
[profile.dev]
debug = 0
